<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تطبيق التأسيس الأكاديمي</title>
  <meta name="theme-color" content="#167d83">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="التأسيس">
  <script>
    /* تطبيق المظهر المحفوظ قبل رسم الصفحة لتجنب الوميض */
    try {
      var savedTheme = localStorage.getItem("study-app-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

  <!-- ========== شاشات التحميل والحساب ========== -->
  <div id="auth-wrap" class="wrap">

    <section id="loading" class="card">
      <h1>تطبيق التأسيس الأكاديمي</h1>
      <p class="muted">جارٍ التحميل...</p>
    </section>

    <section id="auth-view" class="card" hidden>
      <h1>تطبيق التأسيس الأكاديمي</h1>

      <div id="auth-tabs" class="tabs">
        <button type="button" id="tab-login" class="tab active">تسجيل الدخول</button>
        <button type="button" id="tab-signup" class="tab">إنشاء حساب</button>
      </div>

      <p id="auth-message" class="message" role="status" hidden></p>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="login-email">البريد الإلكتروني</label>
          <input id="login-email" type="email" dir="ltr" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">كلمة المرور</label>
          <input id="login-password" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn" class="btn primary">دخول</button>
        <button type="button" id="forgot-btn" class="link-btn">نسيت كلمة المرور؟</button>
      </form>

      <form id="signup-form" class="form" novalidate hidden>
        <div class="field">
          <label for="signup-email">البريد الإلكتروني</label>
          <input id="signup-email" type="email" dir="ltr" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signup-password">كلمة المرور (8 أحرف على الأقل)</label>
          <input id="signup-password" type="password" dir="ltr" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-password2">تأكيد كلمة المرور</label>
          <input id="signup-password2" type="password" dir="ltr" autocomplete="new-password" required>
        </div>
        <button type="submit" id="signup-btn" class="btn primary">إنشاء الحساب</button>
      </form>

      <form id="recovery-form" class="form" novalidate hidden>
        <h2>تعيين كلمة مرور جديدة</h2>
        <div class="field">
          <label for="recovery-password">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
          <input id="recovery-password" type="password" dir="ltr" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="recovery-password2">تأكيد كلمة المرور الجديدة</label>
          <input id="recovery-password2" type="password" dir="ltr" autocomplete="new-password" required>
        </div>
        <button type="submit" id="recovery-btn" class="btn primary">حفظ كلمة المرور</button>
      </form>
    </section>
  </div>

  <!-- ========== هيكل التطبيق بعد تسجيل الدخول ========== -->
  <div id="app-view" class="shell" hidden>

    <header class="topbar">
      <button type="button" id="menu-btn" class="icon-btn" aria-label="فتح القائمة"
              aria-expanded="false" aria-controls="sidebar">
        <span class="bars" aria-hidden="true"></span>
      </button>
      <span id="topbar-title" class="topbar-title"></span>
    </header>

    <div id="overlay" class="overlay" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="التنقل الرئيسي">
      <div class="brand">التأسيس الأكاديمي</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <p class="muted small">الحساب</p>
        <p id="account-email" class="account-email" dir="ltr"></p>
        <button type="button" class="btn small" data-action="logout">تسجيل الخروج</button>
      </div>
    </aside>

    <main id="page" class="page" tabindex="-1">
      <p id="app-message" class="message" role="status" hidden></p>
      <p id="limited-note" class="message info" hidden>
        الجلسة محفوظة على هذا الجهاز. ستُجدَّد تلقائياً عند عودة الإنترنت.
      </p>
      <div id="page-body"></div>
    </main>
  </div>

  <script src="js/vendor/supabase.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/pages/placeholders.js" defer></script>
  <script src="js/study-plan.js" defer></script>
  <script src="js/timer.js" defer></script>
  <script src="js/pages/study.js" defer></script>
  <script src="js/pages/review.js" defer></script>
  <script src="js/pages/progress.js" defer></script>
  <script src="js/pages/notes.js" defer></script>
  <script src="js/pages/labs.js" defer></script>
  <script src="js/backup.js" defer></script>
  <script src="js/pages/settings.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
